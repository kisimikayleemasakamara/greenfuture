spring.application.name=greenfuture

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/greenfuture_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

file.upload-dir=${FILE_UPLOAD_DIR:uploads}

security.jwt.secret-base64=${JWT_SECRET_BASE64}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
security.refresh-token.ttl=${REFRESH_TOKEN_TTL:30d}
security.refresh-token.cookie-secure=${REFRESH_COOKIE_SECURE:true}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
